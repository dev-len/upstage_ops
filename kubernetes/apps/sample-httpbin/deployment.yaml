apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-httpbin
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-httpbin
    app.kubernetes.io/part-of: sample-httpbin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-httpbin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-httpbin
        app.kubernetes.io/part-of: sample-httpbin
    spec:
      serviceAccountName: sample-httpbin
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        topology.k3s.io/role: app
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sample-httpbin
      containers:
        - name: httpbin
          image: nginxinc/nginx-unprivileged:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
