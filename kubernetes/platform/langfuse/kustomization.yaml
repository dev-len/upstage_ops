apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - postgresql.yaml
  - redis.yaml
  - clickhouse.yaml

configMapGenerator:
  - name: langfuse-values
    namespace: langfuse
    files:
      - values/langfuse-values.yaml

generatorOptions:
  disableNameSuffixHash: true
